<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPTX 智能 Agent - 报告生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        /* 1. 预览区整体背景：由黑转为浅灰蓝，消除割裂感 */
        #previewArea {
            background-color: #f8fafc; 
            padding: 2rem !important;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 2. 报告容器：模拟纸张质感 */
        .markdown-body { 
            box-sizing: border-box; 
            min-width: 200px; 
            max-width: 850px; 
            margin: 0 auto; 
            padding: 45px !important; 
            background-color: #ffffff !important;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            color: #334155;
            line-height: 1.7;
        }

        /* 3. 图片与引用块的美化 */
        .markdown-body img {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            margin: 1.5rem 0;
            border: 1px solid #f1f5f9;
        }

        .markdown-body blockquote {
            border-left: 4px solid #3b82f6 !important;
            background: #eff6ff !important;
            color: #1e40af !important;
            padding: 1rem 1.5rem !important;
            border-radius: 0 8px 8px 0;
        }

        /* 滚动条美化 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        
        /* 动画效果 */
        .pulse-blue { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; shadow: 0 0 0px rgba(37, 99, 235, 0); } 50% { opacity: .7; shadow: 0 0 8px rgba(37, 99, 235, 0.5); } }
        .glow-green { box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
        .spinner { animation: rotate 1s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans">

    <div class="flex flex-col h-screen">
        <nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shrink-0">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-lg shadow-blue-100">P</div>
                <span class="text-xl font-bold tracking-tight text-slate-800">PPTX <span class="text-blue-600">Agent</span></span>
            </div>
            <div id="actionGroup" class="hidden flex items-center space-x-4">
                <span id="finishBadge" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">REPORT READY</span>
                <button onclick="downloadMD()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm transition-all shadow-lg shadow-blue-200 active:scale-95">
                    <span>下载 Markdown</span>
                </button>
            </div>
        </nav>

        <div class="flex flex-1 overflow-hidden p-6 gap-6">
            <div class="w-1/3 flex flex-col gap-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase tracking-widest text-center lg:text-left">Upload Section</h3>
                    <div id="dropzone" class="relative border-2 border-dashed border-slate-200 rounded-xl p-8 text-center hover:bg-blue-50 hover:border-blue-300 transition-all cursor-pointer">
                        <input type="file" id="fileInput" class="hidden" accept=".pptx">
                        <div id="uploadPlaceholder">
                            <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
                                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                            </div>
                            <p class="text-sm text-slate-600 font-semibold">点击或拖拽文件</p>
                        </div>
                        <div id="fileDisplay" class="hidden">
                            <div class="flex items-center justify-center space-x-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <svg class="w-8 h-8 text-orange-500" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
                                <div class="text-left">
                                    <p id="fileName" class="text-sm font-bold truncate max-w-[150px]">文件名.pptx</p>
                                    <p id="fileSize" class="text-xs text-slate-400">0.00 MB</p>
                                </div>
                                <button onclick="resetUpload(event)" class="text-slate-300 hover:text-red-500 transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button id="uploadBtn" disabled class="w-full mt-6 bg-slate-100 text-slate-400 font-bold py-3.5 rounded-xl transition-all cursor-not-allowed">
                        等待选择文件
                    </button>
                </div>

                <div id="statusPanel" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-400 mb-6 uppercase tracking-widest">Processing Status</h3>
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div id="step1" class="w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-500"></div>
                                <span class="text-sm text-slate-500 font-medium transition-all duration-500">生成高清幻灯片截图</span>
                            </div>
                            <div id="spin1" class="hidden spinner w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div id="step2" class="w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-500"></div>
                                <span class="text-sm text-slate-500 font-medium transition-all duration-500 text-nowrap">深度解析文本并构建大纲</span>
                            </div>
                            <div id="spin2" class="hidden spinner w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div id="step3" class="w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-500"></div>
                                <span class="text-sm text-slate-500 font-medium transition-all duration-500 text-nowrap">Agent 正在撰写连贯笔记</span>
                            </div>
                            <div id="spin3" class="hidden spinner w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                <div class="bg-slate-50/50 border-b border-slate-100 px-6 py-4">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest text-center">Report Preview</span>
                </div>
                <div id="previewArea" class="flex-1 overflow-y-auto custom-scroll">
                    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-slate-400 mt-20">
                        <svg class="w-16 h-16 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        <p class="text-sm font-medium">准备就绪后将在此显示预览</p>
                    </div>
                    <div id="mdContainer" class="markdown-body hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileDisplay = document.getElementById('fileDisplay');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const mdContainer = document.getElementById('mdContainer');
        const emptyState = document.getElementById('emptyState');
        const statusPanel = document.getElementById('statusPanel');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileName').innerText = file.name;
                document.getElementById('fileSize').innerText = (file.size / 1024 / 1024).toFixed(2) + ' MB';
                uploadPlaceholder.classList.add('hidden');
                fileDisplay.classList.remove('hidden');
                uploadBtn.disabled = false;
                uploadBtn.className = "w-full mt-6 bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition-all cursor-pointer hover:bg-blue-700 active:scale-[0.98]";
                uploadBtn.innerText = "开始深度智能解析";
            }
        };

        function resetUpload(e) {
            e.stopPropagation();
            fileInput.value = "";
            uploadPlaceholder.classList.remove('hidden');
            fileDisplay.classList.add('hidden');
            uploadBtn.disabled = true;
            uploadBtn.innerText = "等待选择文件";
            uploadBtn.className = "w-full mt-6 bg-slate-100 text-slate-400 font-bold py-3.5 rounded-xl transition-all cursor-not-allowed";
            statusPanel.classList.add('hidden');
            emptyState.classList.remove('hidden');
            mdContainer.classList.add('hidden');
            document.getElementById('actionGroup').classList.add('hidden');
        }

        dropzone.onclick = () => fileInput.click();

        uploadBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return;

            uploadBtn.disabled = true;
            uploadBtn.innerText = "解析进行中...";
            statusPanel.classList.remove('hidden');
            
            simulateProgress();

            const formData = new FormData();
            formData.append("file", file);

            try {
                const res = await fetch('/analyze', { method: 'POST', body: formData });
                const result = await res.json();
                
                if (result.status === "success") {
                    finalizeStep();
                    const mdRes = await fetch(`/get-md-content/${result.md_file}`);
                    const content = await mdRes.text();
                    renderMarkdown(content, result.md_file);
                }
            } catch (err) {
                alert("请求失败，请检查后端运行状态");
                resetUpload({ stopPropagation: () => {} });
            }
        };

        function simulateProgress() {
            setStep(1);
            setTimeout(() => setStep(2), 2000); 
            setTimeout(() => setStep(3), 8500); 
        }

        function setStep(step) {
            for(let i=1; i<=3; i++) {
                const dot = document.getElementById(`step${i}`);
                const text = dot.nextElementSibling;
                const spin = document.getElementById(`spin${i}`);

                if (i < step) {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-green-500 glow-green transition-all duration-500";
                    text.className = "text-sm text-slate-400 font-medium transition-all duration-500";
                    spin.classList.add('hidden');
                } else if (i === step) {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-blue-600 pulse-blue transition-all duration-500";
                    text.className = "text-sm text-blue-600 font-bold transition-all duration-500";
                    spin.classList.remove('hidden');
                } else {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-slate-200 transition-all duration-500";
                    text.className = "text-sm text-slate-500 font-medium";
                    spin.classList.add('hidden');
                }
            }
        }

        function finalizeStep() {
            for(let i=1; i<=3; i++) {
                const dot = document.getElementById(`step${i}`);
                const text = dot.nextElementSibling;
                const spin = document.getElementById(`spin${i}`);
                dot.className = "w-2.5 h-2.5 rounded-full bg-green-500 glow-green transition-all duration-500";
                text.className = "text-sm text-slate-400 font-medium transition-all duration-500";
                spin.classList.add('hidden');
            }
        }

        function renderMarkdown(content, filename) {
            window.currentMD = content;
            window.currentFileName = filename;
            emptyState.classList.add('hidden');
            mdContainer.classList.remove('hidden');
            mdContainer.innerHTML = marked.parse(content);
            document.getElementById('actionGroup').classList.remove('hidden');
            uploadBtn.innerText = "报告已生成";
            uploadBtn.className = "w-full mt-6 bg-green-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-green-100 transition-all";
        }

        function downloadMD() {
            const blob = new Blob([window.currentMD], { type: 'text/markdown' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = window.currentFileName; a.click();
        }
    </script>
</body>
</html>
